<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Game Template</title>
<style>
  /* RULE: games are single self-contained files — all CSS lives inline here.
     No external stylesheets, no fonts, no network at play time. */
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0e14; overflow: hidden; }
  /* touch-action: none — the input layer owns pointer gestures; the page never scrolls/zooms. */
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
/* =============================================================================
 * BASE GAME TEMPLATE — the opinionated shell every game in this repo starts from.
 *
 * Copy this file to games/<name>/index.html and fill in the ===== GAME =====
 * section. Single self-contained file: inline JS/CSS, zero dependencies, no
 * build step, no network at play time. Every structural rule is written as a
 * short comment at the point of temptation — KEEP the comments when you copy.
 *
 * All headless verification drives the game through window.__test (state, not
 * pixels). If you break a __test hook, every verifier and playtest fails.
 * ========================================================================== */
'use strict';
(() => {

  // ---------------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------------
  const GAME_TITLE = 'BASE TEMPLATE';
  // RULE: fixed-timestep simulation. The sim ONLY ever advances in FIXED_DT
  // steps (accumulator pattern below); rendering interpolates with an alpha.
  const FIXED_DT = 1 / 60;
  // RULE: clamp the frame delta. A backgrounded/hitching tab must not produce a
  // spiral of death by queueing thousands of catch-up ticks.
  const MAX_FRAME_DELTA = 0.25;
  const TEST_MODE = new URLSearchParams(location.search).get('test') === '1';

  // ---------------------------------------------------------------------------
  // Error capture — feeds __test.errors. Hooked from load, before anything runs.
  // ---------------------------------------------------------------------------
  const capturedErrors = [];
  function captureError(type, message, stack) {
    if (capturedErrors.length >= 100) return; // cap so snapshots stay cheap
    const entry = { type: String(type), message: String(message) };
    if (typeof stack === 'string' && stack) entry.stack = stack;
    capturedErrors.push(entry);
  }
  window.addEventListener('error', (e) => {
    captureError('error', e.message || 'uncaught error', e.error && e.error.stack);
  });
  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    captureError('unhandledrejection',
      (r && r.message) || String(r), r && r.stack);
  });
  const _consoleError = console.error.bind(console);
  console.error = (...args) => {
    captureError('console.error', args.map((a) => {
      if (a instanceof Error) return a.message;
      if (typeof a === 'string') return a;
      try { return JSON.stringify(a); } catch (_) { return String(a); }
    }).join(' '), args[0] instanceof Error ? args[0].stack : undefined);
    _consoleError(...args);
  };

  // ---------------------------------------------------------------------------
  // Seedable PRNG (mulberry32)
  // RULE: ALL game randomness goes through rng(). Math.random is FORBIDDEN in
  // games — it breaks the determinism verifier. Under ?test=1 any Math.random
  // call is recorded into __test.errors (and redirected through rng()).
  // ---------------------------------------------------------------------------
  const DEFAULT_SEED = 1337; // constant, never Date.now(): default load is deterministic
  let rngState = DEFAULT_SEED >>> 0;
  function seedRng(s) { rngState = Number(s) >>> 0; }
  function rng() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    let t = rngState;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---------------------------------------------------------------------------
  // State machine
  // ---------------------------------------------------------------------------
  const STATES = ['LOADING', 'MENU', 'PLAYING', 'PAUSED', 'GAME_OVER'];
  // RULE: `state` is module-private and assigned in exactly TWO places: this
  // initializer and setState() below. Assigning it anywhere else is a defect.
  let state = 'LOADING';

  // RULE: the ONE state-machine chokepoint. Every transition goes through
  // setState(); it is the only code (besides the initializer) that assigns
  // `state`, and the ONLY caller of resetAudioState().
  function setState(next) {
    if (!STATES.includes(next)) throw new Error('setState: unknown state ' + next);
    if (next === state) return;
    const prev = state;
    onStateExit(prev);
    state = next;
    // RULE: audio state resets HERE, on the transition — never from scattered
    // call sites. This is what keeps sounds from leaking across states.
    resetAudioState();
    onStateEnter(next);
  }

  // ---------------------------------------------------------------------------
  // Audio lifecycle
  // ---------------------------------------------------------------------------
  // RULE: the AudioContext is created/unlocked on the FIRST USER GESTURE only
  // (autoplay policy). Never construct it at load time.
  let audioCtx = null;
  const continuousNodes = new Set(); // register every looping/continuous source here
  function unlockAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  // RULE: called ONLY from setState(). Do not call this anywhere else — if you
  // need audio to stop, make a state transition or stop your own node.
  function resetAudioState() {
    for (const node of continuousNodes) {
      try { if (typeof node.stop === 'function') node.stop(); } catch (_) {}
      try { node.disconnect(); } catch (_) {}
    }
    continuousNodes.clear();
  }

  // ---------------------------------------------------------------------------
  // Input mapping layer
  // RULE: keyboard, pointer and touch events are normalized HERE, in one place,
  // into the canonical named actions. Game code reads `actions.left` etc. (or
  // justPressed/justReleased) and NEVER raw events. __test.input() goes through
  // the same setAction() chokepoint — no bypass.
  // ---------------------------------------------------------------------------
  const ACTION_NAMES = ['left', 'right', 'up', 'down', 'primary', 'pause'];
  const actions = {};
  const prevActions = {};
  for (const a of ACTION_NAMES) { actions[a] = false; prevActions[a] = false; }

  function setAction(action, pressed) { // the ONE input chokepoint
    if (!ACTION_NAMES.includes(action)) return;
    actions[action] = !!pressed;
  }
  // Edge helpers — sampled against the previous fixed tick, so a held key is
  // one press, not an OS-repeat stream.
  function justPressed(a) { return actions[a] && !prevActions[a]; }
  function justReleased(a) { return !actions[a] && prevActions[a]; }

  const KEY_TO_ACTION = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'primary', Enter: 'primary',
    KeyP: 'pause', Escape: 'pause',
  };
  window.addEventListener('keydown', (e) => {
    const a = KEY_TO_ACTION[e.code];
    if (!a) return;
    e.preventDefault(); // RULE: the game owns its keys — never let them scroll the page
    unlockAudio();      // first-gesture unlock lives on real input events only
    if (e.repeat) return; // RULE: pressed/released EDGES only — ignore OS key repeat
    setAction(a, true);
  });
  window.addEventListener('keyup', (e) => {
    const a = KEY_TO_ACTION[e.code];
    if (!a) return;
    e.preventDefault();
    setAction(a, false);
  });
  // Pointer events cover mouse, touch and pen — this is the single non-keyboard
  // entry point into the action layer.
  const canvas = document.getElementById('game');
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    unlockAudio();
    setAction('primary', true);
  });
  canvas.addEventListener('pointerup', () => setAction('primary', false));
  canvas.addEventListener('pointercancel', () => setAction('primary', false));

  // ---------------------------------------------------------------------------
  // Canvas, resize, visibility, reduced motion
  // ---------------------------------------------------------------------------
  const ctx = canvas.getContext('2d');
  let viewW = 0, viewH = 0;
  // RULE: devicePixelRatio-aware sizing — the backing store is scaled by dpr,
  // the CSS size stays logical, and all drawing happens in logical pixels.
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // RULE: a hidden tab auto-pauses. PLAYING → PAUSED on visibilitychange; the
  // player resumes manually. Never let the sim free-run while invisible.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'PLAYING') setState('PAUSED');
  });

  // RULE: games must respect REDUCED_MOTION (prefers-reduced-motion): damp or
  // remove non-essential motion, shake, and flashes when it is true.
  const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let REDUCED_MOTION = reducedMotionQuery.matches;
  if (typeof reducedMotionQuery.addEventListener === 'function') {
    reducedMotionQuery.addEventListener('change', (e) => { REDUCED_MOTION = e.matches; });
  }

  // ---------------------------------------------------------------------------
  // Fixed-timestep simulation core
  // ---------------------------------------------------------------------------
  let totalTicks = 0; // fixed steps since load — the ONLY clock the sim may read

  function update(dt) {
    // RULE: update() must be genuinely time-independent. NEVER read Date.now()
    // or performance.now() in here or in anything it calls — time-derived
    // effects use the tick counter (totalTicks * FIXED_DT). __test.tick() and
    // the rAF loop both drive THIS function; it is the single sim entry point.
    //
    // RULE: updateContinuousAudio() runs unconditionally, BEFORE any
    // state-guarded early return below, so continuous sounds can never keep
    // playing into a state that shouldn't have them.
    updateContinuousAudio();
    gameUpdate(dt);
    totalTicks++;
    for (const a of ACTION_NAMES) prevActions[a] = actions[a]; // edge bookkeeping — keep LAST
  }

  function render(alpha) {
    ctx.clearRect(0, 0, viewW, viewH);
    gameRender(ctx, viewW, viewH, alpha);
  }

  // RULE: accumulator pattern. Real time only ever becomes whole FIXED_DT
  // steps; the leftover fraction becomes the render interpolation alpha.
  let accumulator = 0;
  let lastFrameTime = null;
  function frame(now) {
    requestAnimationFrame(frame);
    if (lastFrameTime === null) { lastFrameTime = now; render(1); return; }
    let delta = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    if (delta > MAX_FRAME_DELTA) delta = MAX_FRAME_DELTA; // spiral-of-death clamp
    accumulator += delta;
    while (accumulator >= FIXED_DT) {
      update(FIXED_DT);
      accumulator -= FIXED_DT;
    }
    render(accumulator / FIXED_DT);
  }

  // ---------------------------------------------------------------------------
  // window.__test — the verification hook. THE load-bearing piece of this repo:
  // all headless tooling drives the game through it (state, not pixels).
  // RULE: created if and ONLY if the URL carries ?test=1. Without it,
  // window.__test stays undefined — never define a stub.
  // ---------------------------------------------------------------------------
  if (TEST_MODE) {
    const exposedFns = [];
    // Enforce the no-Math.random rule under test: record a defect, keep running
    // deterministically by redirecting through rng().
    Math.random = function () {
      captureError('math.random', 'Math.random() called — games must use the template rng()');
      return rng();
    };
    window.__test = {
      // current state name
      state: () => state,
      // games register snapshot providers; fn returns a JSON-serializable object
      expose: (fn) => { if (typeof fn === 'function') exposedFns.push(fn); },
      // template fields merged with everything the game exposed (game keys win).
      // totalTicks is deliberately NOT included: it counts real-time rAF frames
      // too, so it would differ between two identical seeded runs and break
      // the determinism verifier. Games expose their own deterministic counters.
      snapshot: () => {
        const snap = { state, reducedMotion: REDUCED_MOTION };
        for (const fn of exposedFns) {
          try { Object.assign(snap, fn()); }
          catch (e) { captureError('snapshot', e.message || String(e), e.stack); }
        }
        return JSON.parse(JSON.stringify(snap)); // guarantee serializability
      },
      // advance exactly n fixed steps synchronously through the SAME update()
      // the rAF loop uses. Afterwards the accumulator and frame clock reset so
      // the running rAF loop cannot double-step time we already simulated.
      tick: (n) => {
        n = Math.max(0, Math.floor(Number(n) || 0));
        for (let i = 0; i < n; i++) update(FIXED_DT);
        accumulator = 0;
        lastFrameTime = null;
        render(1);
      },
      // deterministic reseed of the PRNG (mulberry32 has no derived state)
      seed: (s) => { seedRng(s); },
      // inject a named action through the same input chokepoint — no bypass
      input: (action, pressed) => { setAction(action, pressed); },
      // live array of { type, message, stack? } captured since load
      errors: capturedErrors,
    };
  }

  /* ===========================================================================
   * ===== GAME ================================================================
   * Everything below is the part a game replaces. The template's placeholder
   * "game" only proves the shell is alive: it shows the title, the current
   * state name, and a moving object, and walks MENU ⇄ PLAYING ⇄ PAUSED.
   * ======================================================================== */

  // Placeholder entity. prev* fields exist so render can interpolate.
  const orb = { x: 0, y: 0, prevX: 0, prevY: 0 };

  function gameInit() {
    orb.x = orb.prevX = viewW / 2;
    orb.y = orb.prevY = viewH / 2;
  }

  // Per-state hooks — the ONLY places to run enter/exit logic.
  function onStateEnter(next) { /* placeholder: nothing to set up */ }
  function onStateExit(prev) { /* placeholder: nothing to tear down */ }

  // RULE: continuous/looping sound levels are updated HERE every tick — this
  // hook runs before any state guard, so a loop can never leak across states.
  function updateContinuousAudio() { /* placeholder: no continuous sounds */ }

  function gameUpdate(dt) {
    // Placeholder motion — driven by totalTicks, never wall-clock time; damped
    // under REDUCED_MOTION as every game must do for non-essential motion.
    const speed = REDUCED_MOTION ? 0.2 : 1;
    const t = totalTicks * FIXED_DT * speed;
    orb.prevX = orb.x; orb.prevY = orb.y;
    orb.x = viewW / 2 + Math.cos(t * 1.7) * Math.min(viewW, viewH) * 0.25;
    orb.y = viewH / 2 + Math.sin(t * 2.3) * Math.min(viewW, viewH) * 0.18;

    // All transitions below go through setState() — never assign `state`.
    switch (state) {
      case 'MENU':
        if (justPressed('primary')) setState('PLAYING');
        break;
      case 'PLAYING':
        if (justPressed('pause')) setState('PAUSED');
        break;
      case 'PAUSED':
        if (justPressed('pause')) setState('PLAYING');
        break;
      case 'GAME_OVER':
        if (justPressed('primary')) setState('PLAYING');
        break;
    }
  }

  function gameRender(c, w, h, alpha) {
    // Interpolated draw: lerp(prev, current, alpha) — never draw raw sim state.
    const ox = orb.prevX + (orb.x - orb.prevX) * alpha;
    const oy = orb.prevY + (orb.y - orb.prevY) * alpha;
    c.fillStyle = '#12351f';
    c.beginPath(); c.arc(ox, oy, 14, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#3ddc84'; c.stroke();

    c.fillStyle = '#e6edf3';
    c.font = 'bold 28px system-ui, sans-serif';
    c.textAlign = 'center';
    c.fillText(GAME_TITLE, w / 2, h / 2 - 40);
    c.font = '16px monospace';
    c.fillStyle = '#8b949e';
    c.fillText('state: ' + state, w / 2, h / 2);
    c.fillText('primary = start · pause = pause', w / 2, h / 2 + 24);
  }

  // Template snapshot exposure — games copy this pattern and expose their own
  // gameplay fields (score, entities, counters). Values must MOVE during play.
  if (window.__test) {
    window.__test.expose(() => ({
      placeholder: { x: orb.x, y: orb.y },
    }));
  }

  /* ===== END GAME ========================================================= */

  // Boot. No assets to load, so LOADING hands off to MENU immediately; a game
  // that loads assets stays in LOADING until they are ready (via setState).
  gameInit();
  setState('MENU');
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
